<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sentinel favicon - earth & azure, subtle Martian whisper -->
  <defs>
    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077b6"/>
      <stop offset="100%" style="stop-color:#48cae4"/>
    </linearGradient>
    <linearGradient id="marsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4573a"/>
      <stop offset="100%" style="stop-color:#e8a87c"/>
    </linearGradient>
  </defs>
  <!-- Circle background - warm earth -->
  <circle cx="50" cy="50" r="48" fill="#f7f4f0" stroke="url(#azureGrad)" stroke-width="3"/>
  <!-- Sentinel eye - azure -->
  <ellipse cx="50" cy="50" rx="22" ry="26" fill="none" stroke="url(#azureGrad)" stroke-width="4"/>
  <!-- Inner circle - life -->
  <circle cx="50" cy="50" r="8" fill="url(#azureGrad)"/>
  <!-- Martian whisper - subtle accent -->
  <circle cx="58" cy="42" r="3" fill="url(#marsGrad)" opacity="0.7"/>
</svg>