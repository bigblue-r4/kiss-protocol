<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="720" fill="#03060F"/>
  <rect x="60" y="60" width="1080" height="600" rx="28" fill="#060C1A" stroke="#1A6EB5" stroke-opacity="0.25"/>
  <text x="90" y="120" fill="#E8F4FF" font-family="Arial, sans-serif" font-size="34" font-weight="700">Sentinel Architecture Overview</text>
  <text x="90" y="155" fill="#B4DCFF" font-family="Arial, sans-serif" font-size="18">Verification, enforcement, evidence preservation, and review</text>

  <rect x="90" y="210" width="220" height="120" rx="18" fill="#0A1428" stroke="#2DD4BF" stroke-opacity="0.45"/>
  <text x="120" y="250" fill="#99F6E4" font-family="Arial, sans-serif" font-size="16" font-weight="700">1. Activity enters</text>
  <text x="120" y="282" fill="#E8F4FF" font-family="Arial, sans-serif" font-size="18">Agent exchange</text>
  <text x="120" y="308" fill="#E8F4FF" font-family="Arial, sans-serif" font-size="18">or requested action</text>

  <rect x="355" y="210" width="220" height="120" rx="18" fill="#0A1428" stroke="#3B9EFF" stroke-opacity="0.45"/>
  <text x="385" y="250" fill="#7CC6FF" font-family="Arial, sans-serif" font-size="16" font-weight="700">2. Gatekeeper evaluates</text>
  <text x="385" y="282" fill="#E8F4FF" font-family="Arial, sans-serif" font-size="18">Policy check</text>
  <text x="385" y="308" fill="#E8F4FF" font-family="Arial, sans-serif" font-size="18">Trust boundary review</text>

  <rect x="620" y="210" width="220" height="120" rx="18" fill="#0A1428" stroke="#C9A84C" stroke-opacity="0.55"/>
  <text x="650" y="250" fill="#E2C46F" font-family="Arial, sans-serif" font-size="16" font-weight="700">3. Control decision</text>
  <text x="650" y="282" fill="#E8F4FF" font-family="Arial, sans-serif" font-size="18">Allow · Hold</text>
  <text x="650" y="308" fill="#E8F4FF" font-family="Arial, sans-serif" font-size="18">Block · Escalate</text>

  <rect x="885" y="210" width="220" height="120" rx="18" fill="#0A1428" stroke="#2DD4BF" stroke-opacity="0.45"/>
  <text x="915" y="250" fill="#99F6E4" font-family="Arial, sans-serif" font-size="16" font-weight="700">4. Witness record</text>
  <text x="915" y="282" fill="#E8F4FF" font-family="Arial, sans-serif" font-size="18">Timestamp</text>
  <text x="915" y="308" fill="#E8F4FF" font-family="Arial, sans-serif" font-size="18">Source · Qualification</text>

  <rect x="230" y="430" width="300" height="150" rx="20" fill="#0A1428" stroke="#3B9EFF" stroke-opacity="0.35"/>
  <text x="260" y="470" fill="#7CC6FF" font-family="Arial, sans-serif" font-size="18" font-weight="700">Gatekeeper</text>
  <text x="260" y="505" fill="#E8F4FF" font-family="Arial, sans-serif" font-size="17">Inspects exchanges</text>
  <text x="260" y="532" fill="#E8F4FF" font-family="Arial, sans-serif" font-size="17">Applies explicit rules</text>
  <text x="260" y="559" fill="#E8F4FF" font-family="Arial, sans-serif" font-size="17">Explains why action was held or blocked</text>

  <rect x="565" y="430" width="300" height="150" rx="20" fill="#0A1428" stroke="#2DD4BF" stroke-opacity="0.35"/>
  <text x="595" y="470" fill="#99F6E4" font-family="Arial, sans-serif" font-size="18" font-weight="700">Fair Witness</text>
  <text x="595" y="505" fill="#E8F4FF" font-family="Arial, sans-serif" font-size="17">Records observed facts</text>
  <text x="595" y="532" fill="#E8F4FF" font-family="Arial, sans-serif" font-size="17">Separates knowns from unknowns</text>
  <text x="595" y="559" fill="#E8F4FF" font-family="Arial, sans-serif" font-size="17">Preserves replayable evidence</text>

  <path d="M310 270H355" stroke="#99F6E4" stroke-width="3"/>
  <path d="M575 270H620" stroke="#7CC6FF" stroke-width="3"/>
  <path d="M840 270H885" stroke="#E2C46F" stroke-width="3"/>
  <path d="M730 330V400" stroke="#B4DCFF" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M730 400H715" stroke="#B4DCFF" stroke-width="3"/>
  <path d="M500 505H565" stroke="#B4DCFF" stroke-width="3"/>

  <text x="90" y="630" fill="#B4DCFF" font-family="Arial, sans-serif" font-size="16">Public summaries stay qualified. Protected evidence remains sealed for review, remediation, and reporting.</text>
</svg>
