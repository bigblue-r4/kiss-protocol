<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Anne Flint avatar - earth tones, azure glow, elegant -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7f4f0"/>
      <stop offset="100%" style="stop-color:#f0ebe4"/>
    </linearGradient>
    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077b6"/>
      <stop offset="100%" style="stop-color:#48cae4"/>
    </linearGradient>
    <linearGradient id="marsWhisper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4573a"/>
      <stop offset="100%" style="stop-color:#d4845a"/>
    </linearGradient>
  </defs>
  
  <!-- Circle background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" stroke="url(#azureGrad)" stroke-width="3"/>
  
  <!-- Elegant initials -->
  <text x="100" y="90" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="72" font-weight="500" fill="#2c2418">AF</text>
  
  <!-- Subtitle -->
  <text x="100" y="130" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#6b5d4d" letter-spacing="0.1em">FAIR WITNESS</text>
  
  <!-- Azure glow line -->
  <line x1="60" y1="150" x2="140" y2="150" stroke="url(#azureGrad)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Martian whisper accent -->
  <circle cx="155" cy="65" r="4" fill="url(#marsWhisper)" opacity="0.6"/>
  
  <!-- Understanding symbol - eye motif -->
  <ellipse cx="100" cy="165" rx="15" ry="8" fill="none" stroke="#0077b6" stroke-width="1.5" opacity="0.5"/>
  <circle cx="100" cy="165" r="3" fill="#0077b6" opacity="0.7"/>
</svg>