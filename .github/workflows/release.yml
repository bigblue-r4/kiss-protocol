name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write    # create GitHub release
  id-token: write    # cosign OIDC keyless signing

jobs:
  release:
    name: build and sign release artifacts
    runs-on: ubuntu-latest
    # cosign-installer stays on v3 (cosign v2 sign-blob) and action-gh-release on
    # v2 — their next majors are breaking (cosign v3 switched sign-blob to a
    # bundle format). Both are Node20 actions, so keep the force-node24 shim.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build cross-platform artifacts
        run: |
          set -euo pipefail
          mkdir -p dist

          for GOOS in linux darwin; do
            for GOARCH in amd64 arm64; do
              for BIN in witness enforcer; do
                OUT="dist/${BIN}_${GOOS}_${GOARCH}"
                GOOS=$GOOS GOARCH=$GOARCH GOTOOLCHAIN=local \
                  go build -trimpath -ldflags="-s -w" -buildvcs=false \
                  -o "$OUT" ./cmd/$BIN
                sha256sum "$OUT" > "${OUT}.sha256"
              done
            done
          done

      - name: Sign artifacts with cosign (keyless OIDC)
        run: |
          for f in dist/witness_* dist/enforcer_*; do
            [[ "$f" == *.sha256 ]] && continue
            cosign sign-blob \
              --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found && !/^---$/{print}" CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/witness_*
            dist/enforcer_*
          body: |
            ${{ steps.changelog.outputs.notes }}

            ---

            ## Verification

            Verify any artifact with [cosign](https://docs.sigstore.dev/cosign/overview/):

            ```bash
            cosign verify-blob \
              --certificate-identity-regexp "https://github.com/bigblue-r4/kiss-protocol/.github/workflows/release.yml" \
              --certificate-oidc-issuer   "https://token.actions.githubusercontent.com" \
              --signature witness_linux_amd64.sig \
              --certificate witness_linux_amd64.pem \
              witness_linux_amd64
            ```

            Replace `witness` with `enforcer` and `linux_amd64` with your platform (`linux_arm64`, `darwin_amd64`, `darwin_arm64`).

            ```bash
            sha256sum -c witness_linux_amd64.sha256
            ```
