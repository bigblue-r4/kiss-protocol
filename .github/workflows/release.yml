name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: build and sign release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write    # create GitHub release
      id-token: write    # cosign OIDC keyless signing + build provenance
      attestations: write  # GitHub build-provenance attestations (H08 C07)
    # cosign-installer stays on v3 (cosign v2 sign-blob) and action-gh-release on
    # v2 — their next majors are breaking (cosign v3 switched sign-blob to a
    # bundle format). Both are Node20 actions, so keep the force-node24 shim.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.5.2

      - name: Build cross-platform artifacts
        run: |
          set -euo pipefail
          mkdir -p dist

          for GOOS in linux darwin; do
            for GOARCH in amd64 arm64; do
              for BIN in witness enforcer; do
                OUT="dist/${BIN}_${GOOS}_${GOARCH}"
                # Static on every platform: lets the witness clear inherited
                # capabilities process-wide (internal/sandbox.DropAmbientCaps).
                CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH GOTOOLCHAIN=local \
                  go build -trimpath -ldflags="-s -w" -buildvcs=false \
                  -o "$OUT" ./cmd/$BIN
                # Run from inside dist/ so the file names the binary alone and
                # `sha256sum -c` works where the user downloaded it.
                (cd dist && sha256sum "${BIN}_${GOOS}_${GOARCH}" > "${BIN}_${GOOS}_${GOARCH}.sha256")
              done
            done
          done

          # Fail the release if a checksum file names a path, or does not verify
          # from the download directory.
          cd dist
          for f in *.sha256; do
            if grep -q / "$f"; then echo "::error::$f names a path: $(cat "$f")"; exit 1; fi
            sha256sum -c "$f"
          done

      # H08 C07: a CycloneDX SBOM per binary, read from the Go build info embedded
      # in that exact binary (its modules plus the Go standard library version).
      # Pinned by version; the Go checksum database verifies the tool.
      - name: Generate SBOMs (CycloneDX)
        run: |
          set -euo pipefail
          for f in dist/witness_* dist/enforcer_*; do
            [[ "$f" == *.sha256 ]] && continue
            go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 bin \
              -json -std -version "${GITHUB_REF_NAME}" -output "${f}.cdx.json" "$f"
          done

      # Signs the binaries and their SBOMs.
      - name: Sign artifacts with cosign (keyless OIDC)
        run: |
          for f in dist/witness_* dist/enforcer_*; do
            [[ "$f" == *.sha256 ]] && continue
            cosign sign-blob \
              --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done

      # H08 C07: SLSA build provenance for each binary, recorded by GitHub
      # (verify with `gh attestation verify`). Keeps the cosign signatures above.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # The eight binaries by exact name (not the .sha256/.sig/.pem/.cdx.json sidecars).
          subject-path: |
            dist/witness_linux_amd64
            dist/witness_linux_arm64
            dist/witness_darwin_amd64
            dist/witness_darwin_arm64
            dist/enforcer_linux_amd64
            dist/enforcer_linux_arm64
            dist/enforcer_darwin_amd64
            dist/enforcer_darwin_arm64

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found && !/^---$/{print}" CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/witness_*
            dist/enforcer_*
          body: |
            ${{ steps.changelog.outputs.notes }}

            ---

            ## Verification

            Verify any artifact with [cosign](https://docs.sigstore.dev/cosign/overview/):

            ```bash
            cosign verify-blob \
              --certificate-identity-regexp "https://github.com/bigblue-r4/kiss-protocol/.github/workflows/release.yml" \
              --certificate-oidc-issuer   "https://token.actions.githubusercontent.com" \
              --signature witness_linux_amd64.sig \
              --certificate witness_linux_amd64.pem \
              witness_linux_amd64
            ```

            Replace `witness` with `enforcer` and `linux_amd64` with your platform (`linux_arm64`, `darwin_amd64`, `darwin_arm64`).

            ```bash
            sha256sum -c witness_linux_amd64.sha256
            ```

            Check the build provenance (which workflow, commit and tag built the binary) with the [GitHub CLI](https://cli.github.com/):

            ```bash
            gh attestation verify witness_linux_amd64 --repo bigblue-r4/kiss-protocol
            ```

            Each binary also ships a CycloneDX SBOM, `<binary>.cdx.json`, listing the Go modules and Go version it was built with. It is signed the same way: use `.cdx.json.sig` and `.cdx.json.pem` with the command above.
