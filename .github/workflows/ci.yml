name: ci

on:
  push:
  pull_request:
  schedule:
    # Nightly fuzz at 02:00 UTC — extended corpus run.
    - cron: "0 2 * * *"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Installer service setup (no root; root-only steps stubbed)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go build -o "$RUNNER_TEMP/witness" ./cmd/witness
          bash packaging/witness-service_test.sh "$RUNNER_TEMP/witness"

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run ./...

  reproducible-build:
    name: reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify reproducible build
        run: make verify-reproducible

  fuzz-short:
    name: fuzz short (${{ matrix.pkg }} ${{ matrix.target }})
    runs-on: ubuntu-latest
    # Skip fuzz on the nightly schedule — the fuzz-nightly job handles that.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./internal/soul/, target: FuzzLoad }
          - { pkg: ./internal/store/, target: FuzzAppend }
          - { pkg: ./internal/gate/proto/, target: FuzzDecodeToken }
          - { pkg: ./internal/gate/policy/, target: FuzzParse }
          - { pkg: ./pkg/gateenforce/witnessproof/, target: FuzzVerify }
          - { pkg: ./internal/gossip/, target: FuzzDecodePacket }
          - { pkg: ./internal/mirror/, target: FuzzPushJSON }
          - { pkg: ./internal/merkle/, target: FuzzVerifyAdversarial }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Fuzz ${{ matrix.target }}
        run: bash .github/scripts/fuzz.sh ${{ matrix.pkg }} ${{ matrix.target }} 30s

      - name: Upload fuzz corpus on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-short-${{ strategy.job-index }}-${{ matrix.target }}
          path: ${{ matrix.pkg }}testdata/fuzz
          if-no-files-found: ignore

  fuzz-nightly:
    name: fuzz nightly (${{ matrix.pkg }} ${{ matrix.target }})
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./internal/soul/, target: FuzzLoad }
          - { pkg: ./internal/soul/, target: FuzzHash }
          - { pkg: ./internal/soul/, target: FuzzVerify }
          - { pkg: ./internal/soul/, target: FuzzZeroSoulHash }
          - { pkg: ./internal/store/, target: FuzzAppend }
          - { pkg: ./internal/store/, target: FuzzReadAll }
          - { pkg: ./internal/gossip/, target: FuzzDecodePacket }
          - { pkg: ./internal/gossip/, target: FuzzHeartbeatJSON }
          - { pkg: ./internal/mirror/, target: FuzzPushJSON }
          - { pkg: ./internal/mirror/, target: FuzzOpen }
          - { pkg: ./internal/mirror/, target: FuzzFileBackend }
          - { pkg: ./internal/gate/proto/, target: FuzzDecodeToken }
          - { pkg: ./internal/gate/proto/, target: FuzzDecodeActionRequest }
          - { pkg: ./internal/gate/proto/, target: FuzzDecodeApproval }
          - { pkg: ./internal/gate/proto/, target: FuzzDecodeEpoch }
          - { pkg: ./internal/gate/proto/, target: FuzzDecodeResetBundle }
          - { pkg: ./internal/gate/proto/, target: FuzzParseAmount }
          - { pkg: ./internal/gate/policy/, target: FuzzParse }
          - { pkg: ./pkg/gateenforce/witnessproof/, target: FuzzVerify }
          - { pkg: ./internal/merkle/, target: FuzzProveVerify }
          - { pkg: ./internal/merkle/, target: FuzzVerifyAdversarial }
          - { pkg: ./internal/merkle/, target: FuzzHashLeaf }
          - { pkg: ./internal/merkle/, target: FuzzRoot }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Fuzz ${{ matrix.target }}
        run: bash .github/scripts/fuzz.sh ${{ matrix.pkg }} ${{ matrix.target }} 5m

      - name: Upload fuzz corpus on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-nightly-${{ strategy.job-index }}-${{ matrix.target }}
          path: ${{ matrix.pkg }}testdata/fuzz
          if-no-files-found: ignore
