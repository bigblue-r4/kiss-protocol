name: ci

on:
  push:
  pull_request:
  schedule:
    # Nightly fuzz at 02:00 UTC — extended corpus run.
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Installer service setup (no root; root-only steps stubbed)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go build -o "$RUNNER_TEMP/witness" ./cmd/witness
          bash packaging/witness-service_test.sh "$RUNNER_TEMP/witness"

      - name: Installer input fixtures (no root or network)
        if: matrix.os == 'ubuntu-latest'
        run: |
          bash packaging/install_test.sh
          shellcheck -x install.sh packaging/install_test.sh

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          golangci-lint run ./...

  pilot:
    # Stage 2 pilot: our tlog-witness client against an unmodified, pinned
    # transparency-dev/witness omniwitness, then the whole demo end to end.
    name: pilot (omniwitness interop + demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Install pinned omniwitness
        run: |
          cd "$RUNNER_TEMP"
          GOBIN="$RUNNER_TEMP/bin" go install \
            github.com/transparency-dev/witness/cmd/omniwitness@v0.0.0-20261125093440-4aa9dadc1f0b \
            github.com/transparency-dev/witness/cmd/generate_keys@v0.0.0-20261125093440-4aa9dadc1f0b
      - name: Interop test
        run: HL_OMNIWITNESS="$RUNNER_TEMP/bin/omniwitness" HL_GENERATE_KEYS="$RUNNER_TEMP/bin/generate_keys" go test -run Interop -v ./pkg/checkpoint
      - name: Demo end to end
        run: |
          shellcheck pilot/demo.sh pilot/bench.sh
          mkdir -p "$RUNNER_TEMP/demo/bin" && cp "$RUNNER_TEMP/bin/"* "$RUNNER_TEMP/demo/bin/"
          pilot/demo.sh "$RUNNER_TEMP/demo" | tee "$RUNNER_TEMP/demo.out"
          grep -q '^VERIFIED: ' "$RUNNER_TEMP/demo.out"
          grep -q '^FAILED: Records reproduce' "$RUNNER_TEMP/demo.out"
          grep -q '^UNVERIFIABLE: Witness quorum' "$RUNNER_TEMP/demo.out"
          grep -q '21 of 21 cases matched' "$RUNNER_TEMP/demo.out"

  reproducible-build:
    name: reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Verify reproducible build
        run: make verify-reproducible

  fuzz-short:
    name: fuzz short (${{ matrix.pkg }} ${{ matrix.target }})
    runs-on: ubuntu-latest
    # Skip fuzz on the nightly schedule — the fuzz-nightly job handles that.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./internal/soul/, target: FuzzLoad }
          - { pkg: ./internal/store/, target: FuzzAppend }
          - { pkg: ./internal/gate/proto/, target: FuzzDecodeToken }
          - { pkg: ./internal/gate/policy/, target: FuzzParse }
          - { pkg: ./pkg/gateenforce/witnessproof/, target: FuzzVerify }
          - { pkg: ./internal/gossip/, target: FuzzDecodePacket }
          - { pkg: ./internal/mirror/, target: FuzzPushJSON }
          - { pkg: ./internal/merkle/, target: FuzzVerifyAdversarial }
          - { pkg: ./internal/merkle/, target: FuzzVerifyConsistencyAdversarial }
          - { pkg: ./pkg/pocverify/, target: FuzzParseCanonical }
          - { pkg: ./pkg/tlog/, target: FuzzVerifyConsistency }
          - { pkg: ./pkg/checkpoint/, target: FuzzOpen }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Fuzz ${{ matrix.target }}
        run: bash .github/scripts/fuzz.sh ${{ matrix.pkg }} ${{ matrix.target }} 30s

      - name: Upload fuzz corpus on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-short-${{ strategy.job-index }}-${{ matrix.target }}
          path: ${{ matrix.pkg }}testdata/fuzz
          if-no-files-found: ignore

  fuzz-nightly:
    name: fuzz nightly (${{ matrix.pkg }} ${{ matrix.target }})
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./internal/soul/, target: FuzzLoad }
          - { pkg: ./internal/soul/, target: FuzzHash }
          - { pkg: ./internal/soul/, target: FuzzVerify }
          - { pkg: ./internal/soul/, target: FuzzZeroSoulHash }
          - { pkg: ./internal/store/, target: FuzzAppend }
          - { pkg: ./internal/store/, target: FuzzReadAll }
          - { pkg: ./internal/gossip/, target: FuzzDecodePacket }
          - { pkg: ./internal/gossip/, target: FuzzHeartbeatJSON }
          - { pkg: ./internal/mirror/, target: FuzzPushJSON }
          - { pkg: ./internal/mirror/, target: FuzzOpen }
          - { pkg: ./internal/mirror/, target: FuzzFileBackend }
          - { pkg: ./internal/gate/proto/, target: FuzzDecodeToken }
          - { pkg: ./internal/gate/proto/, target: FuzzDecodeActionRequest }
          - { pkg: ./internal/gate/proto/, target: FuzzDecodeApproval }
          - { pkg: ./internal/gate/proto/, target: FuzzDecodeEpoch }
          - { pkg: ./internal/gate/proto/, target: FuzzDecodeResetBundle }
          - { pkg: ./internal/gate/proto/, target: FuzzParseAmount }
          - { pkg: ./internal/gate/policy/, target: FuzzParse }
          - { pkg: ./pkg/gateenforce/witnessproof/, target: FuzzVerify }
          - { pkg: ./internal/merkle/, target: FuzzProveVerify }
          - { pkg: ./internal/merkle/, target: FuzzVerifyAdversarial }
          - { pkg: ./internal/merkle/, target: FuzzHashLeaf }
          - { pkg: ./internal/merkle/, target: FuzzRoot }
          - { pkg: ./internal/merkle/, target: FuzzConsistency }
          - { pkg: ./internal/merkle/, target: FuzzVerifyConsistencyAdversarial }
          - { pkg: ./pkg/pocverify/, target: FuzzParseCanonical }
          - { pkg: ./pkg/tlog/, target: FuzzVerifyConsistency }
          - { pkg: ./pkg/checkpoint/, target: FuzzOpen }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Fuzz ${{ matrix.target }}
        run: bash .github/scripts/fuzz.sh ${{ matrix.pkg }} ${{ matrix.target }} 5m

      - name: Upload fuzz corpus on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-nightly-${{ strategy.job-index }}-${{ matrix.target }}
          path: ${{ matrix.pkg }}testdata/fuzz
          if-no-files-found: ignore
